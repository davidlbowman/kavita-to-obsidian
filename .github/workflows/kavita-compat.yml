name: Kavita compatibility

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Live Kavita ${{ matrix.kavita }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kavita: ["latest", "nightly"]
    env:
      KAVITA_VERSION: ${{ matrix.kavita }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Pull and start Kavita
        run: |
          docker compose -f test-integration/docker-compose.yml pull
          bun run integration:up

      - name: Live integration tests
        run: bun run integration:test

      - name: Kavita logs
        if: failure()
        run: docker compose -f test-integration/docker-compose.yml logs --no-color | tail -200

      - name: Stop Kavita
        if: always()
        run: bun run integration:down
